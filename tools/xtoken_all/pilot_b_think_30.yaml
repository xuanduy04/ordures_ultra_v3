# One-line entrypoint: XTOKEN_PILOT_CONFIG=tools/xtoken_all/pilot_b_think_30.yaml bash run_xtoken.sh same --teacher-url URL.
# Inherit only the original assets/budgets from this completed run, never its weights.
baseline_run: A-on-11
root: /workspace/storage-shared/nlp/tungks/xtoken_all
run_id_mode: unique
student:
  # null keeps the original initial checkpoint/tokenizer from the baseline YAML.
  model_path: null
  tokenizer_path: null
  chat_template_kwargs:
    enable_thinking: true
runtime:
  worker_venvs: /opt/ray_venvs
  gym_actor_python: /opt/ray_venvs/nemo_rl.environments.nemo_gym.NemoGym/bin/python
  gym_source: /workspace/storage-shared/nlp/vai-1.4-30b/nemo-rl/custom_opt_ultra_selfbuilt_nano/nemo-rl/3rdparty/Gym-workspace/Gym
  gym_venvs: /opt/gym_venvs
  gpu_indices: [0, 1, 2, 3]
  ray_host: null
  ray_port: 6379
  ray_executable: /opt/nemo_rl_venv/bin/ray
  ray_start_if_missing: true
  ray_timeout_s: 180
data_path: /workspace/storage-shared/nlp/tungks/xtoken_all/data/dapo-r2-train/train.jsonl
expected_rows: 16367
data_sha256: eaa5ab3fca49b3d82deb944b3466d6c4bde07da6fafbf960c9e0e34945e0c88b
# null means an already converted general_qa JSONL. Raw inputs use the existing
# math or math_code converter; see the guide, not a new conversion implementation.
dataset_conversion: null
distillation:
  max_num_steps: 30
  max_num_epochs: 1
scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 0.02
      end_factor: 1.0
      total_iters: 3
  - name: torch.optim.lr_scheduler.CosineAnnealingLR
    kwargs:
      T_max: 27
      eta_min: 0.0
  - milestones: [3]
checkpointing:
  save_period: 10
  keep_top_k: 20
pilot_batch:
  global_batch_size: 128
  micro_batch_size: 32
arms:
  same:
    run_id: B-think-30
    tokenizer_mode: same
    gpu_uuids: null
    server_mode_evidence: null
    teacher_url: null
    teacher_model: Qwen3-32B
    teacher_tokenizer: /workspace/storage-shared/models/Qwen3-32B
    teacher_vocab_size: 151936
