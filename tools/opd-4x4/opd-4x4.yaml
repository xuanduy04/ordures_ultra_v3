# Overrides layered on top of config.yaml from the selected checkpoint.
# Model, dataset, teacher, judge and replay settings come from that checkpoint.
cluster:
  num_nodes: 1
  gpus_per_node: 8

grpo:
  max_num_steps: 20
  num_prompts_per_step: 128
  num_generations_per_prompt: 1

policy:
  train_global_batch_size: 128
  generation:
    colocated:
      resources:
        gpus_per_node: 4
  megatron_cfg:
    tensor_model_parallel_size: 2
    context_parallel_size: 2
    expert_model_parallel_size: 4
    scheduler:
      lr_decay_iters: 20

on_policy_distillation:
  xtoken:
    alignment_backend: numba
    alignment_workers: 12

checkpointing:
  ft_save_period: 1
  save_period: 1
