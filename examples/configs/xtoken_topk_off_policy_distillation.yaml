# Explicit approximate objective for an unchanged server limited to top-20.
defaults: xtoken_remote_off_policy_distillation.yaml

loss_fn:
  teacher_distribution_mode: topk_tail_kl
  tail_epsilon: 1.0e-8
  temperature: 1.0
  gold_loss: false
  xtoken_loss: false
  reverse_kl: false
  exact_token_match_only: true

teachers:
  - model_name: /models/Qwen3-235B-A22B
    tokenizer:
      name: /models/Qwen3-235B-A22B
    projection_matrix_path: /data/projections/llama31-qwen3.pt
    weight: 1.0
    train_global_batch_size: ${policy.train_global_batch_size}
    train_micro_batch_size: 1
    max_total_sequence_length: 256
    make_sequence_length_divisible_by: 1
    dynamic_batching: ${policy.dynamic_batching}
    sequence_packing: ${policy.sequence_packing}
    remote:
      url: http://teacher.internal:8000
      model: Qwen3-235B-A22B-Instruct
      model_vocab_size: 151936
      score_mode: topk
      top_k: 20
      api_key_env: null
      max_score_elements: 4000000
      max_response_bytes: 67108864
      request_timeout_s: 180
      max_attempts: 2
      retry_backoff_s: 1
      normalization_atol: 0.02
