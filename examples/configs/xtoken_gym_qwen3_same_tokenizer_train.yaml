defaults: xtoken_gym_qwen3_gemma4_train.yaml

teachers:
  - model_name: ${oc.env:XTOKEN_STUDENT_MODEL}
    tokenizer:
      name: ${oc.env:XTOKEN_STUDENT_MODEL}
      chat_template_kwargs:
        enable_thinking: false
    projection_matrix_path: null
    weight: 1.0
    train_global_batch_size: ${policy.train_global_batch_size}
    train_micro_batch_size: 1
    max_total_sequence_length: ${on_policy.teacher_max_total_sequence_length}
    make_sequence_length_divisible_by: 1
    dynamic_batching: ${policy.dynamic_batching}
    sequence_packing: ${policy.sequence_packing}
    remote:
      url: http://172.29.191.69:8000
      model: Qwen3-32B
      model_vocab_size: 151936
      score_mode: topk
      top_k: 20
      api_key_env: null
      max_score_elements: 4000000
      max_response_bytes: 67108864
      request_timeout_s: 180
      max_attempts: 2
      retry_backoff_s: 1
      normalization_atol: 0.02
